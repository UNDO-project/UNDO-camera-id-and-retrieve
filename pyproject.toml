[project]
name = "cctv-identification-and-research"
version = "0.6.1"
description = "A pipeline to scrape cctv data and identify given cameras in urban settings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.126.0",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "notebook>=7.5.2",
    "open-clip-torch>=3.2.0",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "playwright>=1.57.0",
    "pre-commit>=4.3.0",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "ruff>=0.14.10",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "torch>=2.9.1",
    "ultralytics>=8.3.228",
    "uvicorn>=0.40.0",
    "websockets>=16.0",
]

[project.scripts]
cidar-scrape = "src.scraping.main:main"
cidar-build = "src.building.main:main"
cidar-rebuild-manifest = "src.building.reconstruct_cli:main"
cidar-validate = "src.validation.cli:main"
cidar-identify = "src.identification.cli:main"
cidar-api = "src.api.main:run"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.uv]
package = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
